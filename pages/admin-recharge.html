<script>
document.addEventListener('DOMContentLoaded', function(){
  var $=function(i){return document.getElementById(i)}, esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var direct=false, sb=function(){return typeof DB!=='undefined'&&DB.useSupabase&&DB.useSupabase()};
  function paintToggle(){var b=$('rc-toggle');b.textContent=direct?'ON — tap to turn OFF':'OFF — tap to turn ON';b.className='btn '+(direct?'btn-primary':'btn-outline')}
  async function load(){
    if(sb()){
      var s=await supabaseClient.from('store_settings').select('value').eq('key','recharge_direct').maybeSingle();direct=!!(s.data&&s.data.value==='1');
      var r=await supabaseClient.from('recharge_requests').select('*').order('created_at',{ascending:false}).limit(200);render(r.data||[]);
    }else{try{direct=localStorage.getItem('smd_recharge_direct')==='1'}catch(e){}render(JSON.parse(localStorage.getItem('smd_recharge_reqs')||'[]'))}
    paintToggle();
  }
  function render(rows){
    $('rc-list').innerHTML=rows.length?rows.map(function(r){
      var st=r.status;
      return '<div class="card" style="padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>'+esc(r.id)+' · ₹'+esc(r.amount)+'</b><span class="badge">'+esc(st)+(r.ai_status?' · AI '+esc(r.ai_status):'')+'</span></div>'+(r.ai_notes?'<div style="font-size:12.5px;margin:6px 0;color:'+(r.ai_status==='failed'?'#ef4444':'#22c55e')+'">'+esc(r.ai_notes)+'</div>':'')+
      '<div class="text-dim" style="font-size:13.5px;line-height:1.7">'+esc(r.type)+' · '+esc(r.operator)+' · '+esc(r.circle)+'<br>Mobile: <b style="color:var(--text)">'+esc(r.mobile)+'</b>'+(r.plan?' · '+esc(r.plan):'')+'<br>'+esc(r.user_name)+' ('+esc(r.user_email)+') · '+new Date(r.created_at).toLocaleString()+'</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+(String(r.screenshot_url||'').indexOf('http')===0||String(r.screenshot_url||'').indexOf('data:image')===0?'<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="'+esc(r.screenshot_url)+'">View screenshot</a>':'')+
      (st==='pending'?'<button class="btn btn-primary btn-sm" data-id="'+esc(r.id)+'" data-s="accepted">Accept</button><button class="btn btn-outline btn-sm" data-id="'+esc(r.id)+'" data-s="rejected">Reject</button>':'')+
      (st==='accepted'?'<button class="btn btn-primary btn-sm" data-id="'+esc(r.id)+'" data-s="done">Mark recharged</button>':'')+'</div></div>';
    }).join(''):'<div class="empty-state"><i class="fa-solid fa-mobile-screen"></i><h3>No recharge requests yet</h3></div>';
  }
  $('rc-toggle').addEventListener('click',async function(){
    direct=!direct;
    try{localStorage.setItem('smd_recharge_direct',direct?'1':'0')}catch(e){}
    if(sb()){var r=await supabaseClient.from('store_settings').upsert({key:'recharge_direct',value:direct?'1':'0',updated_at:new Date().toISOString()});if(r.error){direct=!direct;alert('Could not save: '+r.error.message)}}
    paintToggle();
  });
  $('rc-list').addEventListener('click',async function(e){
    var b=e.target.closest('[data-id]');if(!b)return;
    if(sb()){var r=await supabaseClient.from('recharge_requests').update({status:b.dataset.s,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);if(r.error)return alert(r.error.message)}
    else{var a=JSON.parse(localStorage.getItem('smd_recharge_reqs')||'[]');a.forEach(function(x){if(x.id===b.dataset.id)x.status=b.dataset.s});localStorage.setItem('smd_recharge_reqs',JSON.stringify(a))}
    load();
  });
  App.boot('shop').then(function(){ if(!Auth.isAdmin()){location.href='login.html';return} load(); });
});
</script>
