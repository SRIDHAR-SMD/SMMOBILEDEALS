<script>
document.addEventListener('DOMContentLoaded', function(){
App.boot('shop').then(async () => {
  await Orders.refresh();
  const root = document.getElementById('orders-root');

  function renderOrders(){
  if (!Auth.isLoggedIn()){
    root.innerHTML = `<div class="empty-state"><i class="fa-solid fa-user-lock"></i><h3>Please log in</h3><p>Log in to view your order history.</p><a href="login.html" class="btn btn-primary" style="margin-top:14px;">Login</a></div>`;
  } else {
    const user = Auth.currentUser();
    const orders = user.role === 'admin' ? DB.getOrders() : Orders.forUser(user.id);
    if (!orders.length){
      root.innerHTML = `<div class="empty-state"><i class="fa-solid fa-receipt"></i><h3>No orders yet</h3><p>Your placed orders will show up here.</p><a href="products.html" class="btn btn-primary" style="margin-top:14px;">Start Shopping</a></div>`;
    } else {
      root.innerHTML = orders.map(o => {
        const meta = Orders.STATUS_META[Orders.displayStatus(o)];
        return `
        <div class="card order-card">
          <div class="order-head">
            <div><strong style="font-family:var(--font-mono);">${o.id}</strong><div class="text-faint" style="font-size:12px;">${Utils.formatDate(o.createdAt)}</div></div>
            <span class="badge ${meta.badge}"><i class="fa-solid ${meta.icon}"></i> ${meta.label}</span>
          </div>
          <div class="order-items-mini">${o.items.map(i => { const prod = (DB.getProducts().find(p => p.id === i.id)) || i; return `<img src="${Utils.productImage(prod)}" onerror="this.onerror=null;this.src='${Utils.deviceImage(i.type,i.color)}'" title="${Utils.escapeHtml(i.name)} × ${i.qty}">`; }).join('')}</div>
          ${o.orderStatus==='cancelled' && o.refundCommission!=null ? `<div class="text-faint" style="font-size:12.5px;margin:8px 0;"><i class="fa-solid fa-money-bill-transfer"></i> Cancellation charge ${Utils.formatINR(o.refundCommission)} &middot; ${o.refundAmount>0 ? `Refund ${Utils.formatINR(o.refundAmount)} ${o.refundStatus==='sent' ? '— <b style="color:var(--success)">sent</b>' : '— due by ' + Utils.formatDate(o.refundDueDate)}` : 'No refund due'}</div>` : ''}
          <div class="flex justify-between items-center">
            <span class="text-dim" style="font-size:13.5px;">${o.items.length} item(s) · <span style="font-family:var(--font-mono);color:var(--text);">${Utils.formatINR(o.totals.total)}</span></span>
            <div class="flex gap-8">
              ${o.paymentStatus==='awaiting_payment' ? `<a href="payment.html?order=${o.id}" class="btn btn-deal btn-sm">Pay Now</a>` : ''}
              ${(o.paymentMethod==='advance' && o.balanceStatus==='due') ? `<a href="payment.html?order=${o.id}" class="btn btn-deal btn-sm"><i class="fa-solid fa-hand-holding-dollar"></i> Pay Balance</a>` : ''}
              ${(o.paymentStatus==='confirmed' || user.role==='admin') ? `<a href="invoice.html?order=${o.id}" class="btn btn-outline btn-sm"><i class="fa-solid fa-file-invoice"></i> ${user.role==='admin' ? 'Generate Bill' : 'Bill'}</a>` : ''}
              <a href="tracking.html?order=${o.id}" class="btn btn-outline btn-sm">Track</a>
              ${(user.role!=='admin' && Orders.canCancel(o)) ? `<button type="button" class="btn btn-outline btn-sm btn-cancel-order" data-order-id="${o.id}" style="color:var(--danger,#3868d9);border-color:var(--danger,#3868d9);" title="A ${Utils.formatINR(Orders.REFUND_COMMISSION)} cancellation charge applies to paid orders">Cancel</button>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }
  }
  }

  renderOrders();

  root.addEventListener('click', async (e) => {
    const btn = e.target.closest('.btn-cancel-order');
    if (!btn) return;
    const orderId = btn.dataset.orderId;
    const ord = Orders.byId(orderId), q = Orders.cancelQuote(ord);
    const msg = q.paid > 0
      ? `Cancel order ${orderId}?\n\nCancellation charge: ${Utils.formatINR(q.charge)} (kept by SM Mobile Deals)\nYou paid: ${Utils.formatINR(q.paid)}\n` + (q.refund > 0 ? `Refund to you: ${Utils.formatINR(q.refund)} within 7 days\n` : `Refund to you: nothing (the charge covers the amount paid)\n`) + `\nThis can't be undone.`
      : `Cancel order ${orderId}?\n\nNo payment has been taken, so there is no cancellation charge.\n\nThis can't be undone.`;
    if (!confirm(msg)) return;
    btn.disabled = true; btn.textContent = 'Cancelling…';
    const res = await Orders.cancelOrder(orderId, Auth.currentUser().id);
    if (res.ok){
      Notify.toast(res.quote && res.quote.refund > 0 ? `Order cancelled. Refund of ${Utils.formatINR(res.quote.refund)} within 7 days.` : 'Order cancelled.', 'success');
      renderOrders();
    } else {
      Notify.toast(res.error || 'Could not cancel this order.', 'error');
      btn.disabled = false; btn.textContent = 'Cancel';
    }
  });
});
});
</script>
