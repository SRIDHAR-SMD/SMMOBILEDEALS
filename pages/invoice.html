<script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('smd_theme') || 'dark');}catch(e){}try{if(sessionStorage.getItem('smd_splash'))document.documentElement.classList.add('no-splash');}catch(e){}setTimeout(function(){var e=document.getElementById('page-loader');if(e){e.classList.add('hide');setTimeout(function(){e.remove()},400)}},1800);})();</script>

<style>
  .inv-wrap{ max-width:820px; margin:0 auto; padding:30px 0 60px; }
  .inv-sheet{ background:#fff; color:#1a1a1a; border-radius:14px; padding:40px; box-shadow:var(--shadow-lg); }
  .inv-sheet *{ color:#1a1a1a; }
  html[data-theme] .inv-sheet, html[data-theme] .inv-sheet *{ text-shadow:none !important; filter:none !important; opacity:1; }
  html[data-theme] .inv-sheet :is(td,th,div,span,b,small,p,h1,h2,h3,h4,i):not([style*="color"]):not(.inv-status):not(.inv-seal){ color:#1a1a1a !important; -webkit-text-fill-color:#1a1a1a; }
  html[data-theme] #inv-root .inv-table th{ background:#1e293b !important; color:#fff !important; -webkit-text-fill-color:#fff; border-bottom-color:#1e293b !important; }
  html[data-theme] #inv-root .spec-line{ color:#555 !important; -webkit-text-fill-color:#555; }
  html[data-theme] #inv-root .inv-meta, html[data-theme] #inv-root .inv-brand small{ color:#333 !important; }
  html[data-theme] #inv-root .inv-seal{ color:#2555c4 !important; -webkit-text-fill-color:#2555c4; }
  html[data-theme] #inv-root .inv-status.inv-ok{ background:#dcfce7 !important; color:#166534 !important; -webkit-text-fill-color:#166534; }
  html[data-theme] #inv-root .inv-status.inv-warn{ background:#fef3c7 !important; color:#92400e !important; -webkit-text-fill-color:#92400e; }
  html[data-theme] #inv-root .inv-ok-txt, html[data-theme] #inv-root .inv-ok-txt span{ color:#166534 !important; -webkit-text-fill-color:#166534; }
  html[data-theme] #inv-root .inv-warn-txt, html[data-theme] #inv-root .inv-warn-txt span{ color:#92400e !important; -webkit-text-fill-color:#92400e; }
  html[data-theme] #inv-root .inv-contact, html[data-theme] #inv-root .inv-contact div{ color:#111 !important; -webkit-text-fill-color:#111; }
  html[data-theme] #inv-root .inv-contact-note{ color:#333 !important; -webkit-text-fill-color:#333; }
  html[data-theme] #inv-root .inv-gst{ color:#333 !important; -webkit-text-fill-color:#333; }
  html[data-theme] #inv-root .inv-table td{ border-bottom:1px solid #ddd !important; }
  .inv-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #1a1a1a; padding-bottom:18px; margin-bottom:22px; }
  .inv-brand{ font-family:var(--font-display); font-size:22px; font-weight:800; }
  .inv-brandrow{ display:flex; align-items:center; gap:14px; }
  .inv-logo{ height:60px; width:60px; object-fit:contain; border-radius:10px; }
  .inv-brand small{ display:block; font-family:var(--font-sans); font-size:12px; font-weight:500; color:#555; margin-top:4px; }
  .inv-meta{ text-align:right; font-size:12.5px; line-height:1.6; }
  .inv-meta b{ font-family:var(--font-mono); }
  .inv-section-title{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:#666; margin-bottom:6px; }
  .inv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:24px; }
  .inv-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:22px; }
  .inv-table th{ text-align:left; border-bottom:2px solid #1a1a1a; padding:8px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .inv-table td{ border-bottom:1px solid #ddd; padding:9px 6px; vertical-align:top; }
  .inv-table .spec-line{ font-size:11px; color:#666; margin-top:2px; }
  .inv-totals{ margin-left:auto; width:260px; font-size:13px; }
  .inv-totals .row{ display:flex; justify-content:space-between; padding:5px 0; }
  .inv-totals .grand{ border-top:2px solid #1a1a1a; margin-top:6px; padding-top:8px; font-weight:800; font-size:15px; }
  .inv-status{ display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:#16a34a1a; color:#16a34a; }
  .inv-footer{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:44px; padding-top:20px; border-top:1px dashed #bbb; }
  .inv-sign-box{ text-align:center; }
  .inv-sign-box img{ max-height:56px; max-width:180px; display:block; margin:0 auto 4px; }
  .inv-sign-line{ border-top:1px solid #333; width:180px; margin:0 auto; padding-top:6px; font-size:11px; color:#555; }
  .inv-seal{ width:104px; height:104px; border-radius:50%; border:3px double #2555c4; color:#2555c4; display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--font-display); font-weight:800; font-size:11.5px; line-height:1.25; transform:rotate(-8deg); opacity:.85; letter-spacing:.02em; }
  .inv-contact{ font-size:13px; line-height:1.65; max-width:320px; font-weight:500; }
  .inv-contact-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; margin-bottom:3px; }
  .inv-contact-note{ font-size:11.5px; margin-top:4px; }
  .inv-gseal{ display:block; flex:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .inv-actions{ display:flex; gap:10px; justify-content:center; margin:22px 0; }
  .inv-table-wrap{ width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }

  @media (max-width:680px){
    .inv-wrap{ padding:14px 0 40px; }
    .inv-sheet{ padding:18px; border-radius:10px; }
    .inv-head{ flex-direction:column; gap:10px; align-items:flex-start; }
    .inv-meta{ text-align:left; }
    .inv-brand{ font-size:19px; }
    .inv-grid{ grid-template-columns:1fr; gap:16px; margin-bottom:18px; }
    .inv-table{ min-width:480px; font-size:11.5px; }
    .inv-totals{ width:100%; max-width:260px; }
    .inv-footer{ flex-direction:column; align-items:flex-start; gap:18px; }
    .inv-contact{ max-width:100%; }
    .inv-footer > div:last-child, .inv-footer > .inv-gseal{ align-self:center; }
    .inv-sign-box{ align-self:center; }
    .inv-actions{ flex-direction:column; }
    .inv-actions .btn{ width:100%; justify-content:center; }
  }

  @media print{
    .site-header, .site-footer, .announce-bar, .inv-actions, #page-loader, #smd-dock, #ai-fab, #chat-panel, #gps-toggle, #wa-chooser, #sat-notice, #smd-admin-gw, #qr-lightbox, .fab-badge, [class*="chatbot"], [class*="smd-dock"], [id*="chat"], [id*="fab"], [class*="fab"], .toast, .toast-wrap, #toast-wrap, #pwa-install{ display:none !important; }
    body{ background:#fff !important; }
    .inv-sheet{ box-shadow:none; border-radius:0; padding:0; }
    .inv-wrap{ max-width:100%; padding:0; }
  }
</style>

<body>
<div id="page-loader">
  <div class="pl-inner">
    <div class="pl-mark"><span>S</span><span>M</span></div>
    <div class="pl-title" id="pl-title" data-text="SM Mobile Deals"></div>
    <div class="pl-sub">Genuine tech, honest prices.</div>
    <div class="pl-bar"><div class="pl-bar-fill"></div></div>
  </div>
</div>
<div id="site-header"></div>

<main>
  <section class="container inv-wrap">
    <div class="inv-actions">
      <button class="btn btn-primary" id="inv-print-btn"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
      <a href="orders.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to Orders</a>
    </div>
    <div id="inv-root" class="inv-sheet"></div>
  </section>
</main>

<div id="site-footer"></div>

<script>const ROOT_PREFIX = '../';</script>
<script defer src="../js/vendor/supabase.min.js"></script>
<script defer src="../js/supabase-client.js"></script>
<script defer src="../js/config.js"></script>

<script defer src="../js/reminders.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function(){
App.boot('shop').then(async () => {
  if (!Auth.isLoggedIn()){ window.location.href = 'login.html'; return; }
  const orderId = Utils.qs('order');
  const localCopy = Orders.byId(orderId); // keep the just-created bill in case the server list does not have it yet
  await Orders.refresh();
  const order = Orders.byId(orderId) || localCopy;
  const root = document.getElementById('inv-root');
  if (!order){
    root.innerHTML = `<div class="empty-state" style="color:#1a1a1a;"><i class="fa-solid fa-circle-exclamation"></i><h3>Order not found</h3></div>`;
    return;
  }
  const me = Auth.currentUser();
  const isAdmin = me && me.role === 'admin';
  if (!isAdmin && order.userId !== me.id){
    root.innerHTML = `<div class="empty-state" style="color:#1a1a1a;"><i class="fa-solid fa-lock"></i><h3>This bill isn't yours to view</h3></div>`;
    return;
  }

  const products = DB.getProducts();
  const signatureUrl = await Inbox.getSetting('admin_signature_url');
  let logoUrl = '';
  try{ logoUrl = (await Inbox.getSetting('logo_dark_url')) || ''; }catch(e){}
  if (!logoUrl) logoUrl = ROOT_PREFIX + ((SITE_CONFIG.logo && SITE_CONFIG.logo.dark) || 'assets/logos/logo-dark.png');

  const rows = (order.items || []).map(item => {
    const p = products.find(pp => pp.id === item.id);
    const lineTotal = (item.price || 0) * (item.qty || 1);
    const pr = BillLines.prices(item, p, Utils.formatINR);
    return `<tr>
      <td>${Utils.escapeHtml(item.name)}${BillLines.detailHtml(item, p)}</td>
      <td style="text-align:center;">${item.qty}</td>
      <td style="text-align:right;font-family:var(--font-mono);">${pr[0]}</td>
      <td style="text-align:right;font-family:var(--font-mono);">${pr[1]}</td>
      <td style="text-align:right;font-family:var(--font-mono);font-weight:700;">${Utils.formatINR(lineTotal)}</td>
    </tr>`;
  }).join('');
  const manualEntry = (order.timeline || []).find(x => /Manual bill/i.test(x.note || ''));
  const billDate = (manualEntry && manualEntry.at) || order.createdAt;

  const t = order.totals || {};
  const isAdvanceOrder = order.paymentMethod === 'advance';
  const balancePaid = order.balanceStatus === 'paid';
  const fullyPaid = order.paymentStatus === 'confirmed' && (!isAdvanceOrder || balancePaid);
  const statusLabel = fullyPaid ? 'Payment Received' : (isAdvanceOrder && order.paymentStatus === 'confirmed') ? 'Advance Paid — Balance Due' : (order.paymentStatus||'').replace(/_/g,' ');

  root.innerHTML = `
    <div class="inv-head">
      <div>
        <div class="inv-brandrow">
          <img class="inv-logo" src="${Utils.escapeHtml(logoUrl)}" alt="${Utils.escapeHtml(SITE_CONFIG.shopName)}" onerror="this.style.display='none'">
          <div class="inv-brand">${SITE_CONFIG.shopName}<small>${SITE_CONFIG.legalName} · ${SITE_CONFIG.address}<br>${(SITE_CONFIG.phones || []).join(' / ')}</small></div>
        </div>
      </div>
      <div class="inv-meta">
        <div><b>${order.userId ? 'Invoice for Order' : 'Invoice No:'} ${Utils.escapeHtml(order.id)}</b></div>
        <div>Date: ${Utils.formatDate(billDate)}</div>
        <div style="margin-top:6px;"><span class="inv-status ${fullyPaid?'inv-ok':'inv-warn'}">${statusLabel}</span></div>
      </div>
    </div>

    <div class="inv-grid">
      <div>
        <div class="inv-section-title">Billed To</div>
        <div style="font-size:13.5px;line-height:1.6;">
          ${Utils.escapeHtml(order.address?.name || '')}<br>
          ${Utils.escapeHtml(order.address?.line1 || '')}<br>
          ${(() => { const a = order.address || {}; const l = [a.city, a.state].filter(Boolean).join(', ') + (a.pincode ? ' ' + a.pincode : ''); return l.trim() ? Utils.escapeHtml(l) + '<br>' : ''; })()}
          ${Utils.escapeHtml(order.address?.phone || '')}
        </div>
      </div>
      <div>
        <div class="inv-section-title">Payment</div>
        <div style="font-size:13.5px;line-height:1.6;">
          Method: ${(order.paymentMethod||'').toUpperCase()}<br>
          Delivery estimate: ${Utils.escapeHtml(order.deliveryEstimate || '—')}
        </div>
      </div>
    </div>

    <table class="inv-table">
      <thead><tr><th>Item</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Price</th><th style="text-align:right;">Discount Price</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  const tableWrap = document.createElement('div');
  tableWrap.className = 'inv-table-wrap';
  const tableEl = root.querySelector('.inv-table');
  tableEl.parentNode.insertBefore(tableWrap, tableEl);
  tableWrap.appendChild(tableEl);
  root.insertAdjacentHTML('beforeend', `
    <div class="inv-totals">
      <div class="row"><span>Subtotal</span><span style="font-family:var(--font-mono);">${Utils.formatINR(t.subtotal ?? t.total)}</span></div>
      ${t.deliveryFee ? `<div class="row"><span>Delivery</span><span style="font-family:var(--font-mono);">${Utils.formatINR(t.deliveryFee)}</span></div>` : ''}
      ${t.cardSurcharge ? `<div class="row"><span>Card surcharge</span><span style="font-family:var(--font-mono);">${Utils.formatINR(t.cardSurcharge)}</span></div>` : ''}
      <div class="row grand"><span>Total</span><span style="font-family:var(--font-mono);">${Utils.formatINR(t.total)}</span></div>
      ${isAdvanceOrder ? `
      <div class="row inv-ok-txt"><span>Advance paid (non-refundable)</span><span style="font-family:var(--font-mono);">${Utils.formatINR(t.advanceAmount)}</span></div>
      <div class="row ${balancePaid?'inv-ok-txt':'inv-warn-txt'}"><span>Balance ${balancePaid?'paid':'due'}</span><span style="font-family:var(--font-mono);">${Utils.formatINR(t.balanceAmount)}</span></div>` : ''}
      <div class="row inv-gst" style="font-size:12px;">Inclusive of ${Math.round((SITE_CONFIG.gstRate||0)*100)}% GST</div>
    </div>

    <div class="inv-footer">
      <div class="inv-contact">
        <div class="inv-contact-title">Contact Us</div>
        <div>${SITE_CONFIG.shopName}, ${SITE_CONFIG.address}</div>
        <div>Phone: ${(SITE_CONFIG.phones || []).join(' / ')}</div>
        <div>Email: ${SITE_CONFIG.email || ''}</div>
        <div class="inv-contact-note">This is a system-generated bill from ${SITE_CONFIG.shopName}.</div>
      </div>
      <div class="inv-sign-box">
        <div style="font-size:11px;color:#555;margin-bottom:2px;">For ${SITE_CONFIG.shopName}</div>
        ${signatureUrl ? `<img src="${signatureUrl}" alt="Authorised signature">` : '<div style="height:44px;"></div>'}
        <div class="inv-sign-line">Authorised Signatory<br><b>Sridhar S</b></div>
      </div>
      <svg class="inv-gseal" viewBox="0 0 120 120" width="112" height="112" role="img" aria-label="Digital seal">
        <defs>
          <linearGradient id="gold-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e27a"/><stop offset=".5" stop-color="#c9971c"/><stop offset="1" stop-color="#8a6508"/></linearGradient>
          <path id="seal-arc-top" d="M 20 60 A 40 40 0 0 1 100 60"/>
          <path id="seal-arc-bot" d="M 16 60 A 44 44 0 0 0 104 60"/>
          <clipPath id="seal-clip"><circle cx="60" cy="60" r="26"/></clipPath>
        </defs>
        <circle cx="60" cy="60" r="57" fill="#fffdf5" stroke="url(#gold-g)" stroke-width="3"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gold-g)" stroke-width="1.2"/>
        <circle cx="60" cy="60" r="30" fill="#fff" stroke="url(#gold-g)" stroke-width="2.5"/>
        <text font-family="Inter,Arial,sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.6" fill="#8a6508" text-anchor="middle"><textPath href="#seal-arc-top" startOffset="50%">${SITE_CONFIG.shopName.toUpperCase()}</textPath></text>
        <text font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.4" fill="#8a6508" text-anchor="middle"><textPath href="#seal-arc-bot" startOffset="50%" side="right">★ DIGITAL SEAL ★</textPath></text>
        <image href="${Utils.escapeHtml(logoUrl)}" x="34" y="34" width="52" height="52" preserveAspectRatio="xMidYMid meet" clip-path="url(#seal-clip)"/>
      </svg>
    </div>`);

  /* hide every floating widget (chatbot, dock, WhatsApp, toasts...) while printing / saving PDF */
  let hiddenFixed = [];
  window.addEventListener('beforeprint', () => {
    hiddenFixed = [];
    document.querySelectorAll('body *').forEach(el => {
      if (el.closest('#inv-root')) return;
      const pos = getComputedStyle(el).position;
      if (pos === 'fixed' || pos === 'sticky'){ hiddenFixed.push([el, el.style.display]); el.style.setProperty('display', 'none', 'important'); }
    });
  });
  window.addEventListener('afterprint', () => { hiddenFixed.forEach(([el, d]) => { el.style.removeProperty('display'); if (d) el.style.display = d; }); hiddenFixed = []; });
  document.getElementById('inv-print-btn').addEventListener('click', () => window.print());
});
});
</script>
<script src="../js/fast-nav.js"></script>
</body>
</html>
