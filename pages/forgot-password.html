<body>
<div id="page-loader">
  <div class="pl-inner">
    <div class="pl-mark"><span>S</span><span>M</span></div>
    <div class="pl-title" id="pl-title" data-text="SM Mobile Deals"></div>
    <div class="pl-sub">Genuine tech, honest prices.</div>
    <div class="pl-bar"><div class="pl-bar-fill"></div></div>
  </div>
</div>
<div id="site-header"></div>

<main>
  <section class="container auth-split">
    <div class="card auth-card">
      <div style="text-align:center;margin-bottom:20px;">
        <div data-logo-slot style="width:56px;height:56px;margin:0 auto 12px;">
          <img class="logo-img" alt="SM Mobile Deals" style="display:none;width:100%;height:100%;object-fit:contain;">
          <div class="logo-fallback" style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--deal));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;"><i class="fa-solid fa-bolt"></i></div>
        </div>
        <h1 style="font-family:var(--font-display);font-size:22px;margin:0 0 4px;">Forgot password?</h1>
        <p class="text-dim" style="font-size:13.5px;margin:0;"><span id="fp-sub">Enter your registered email and we will send you a one-time code.</span></p>
      </div>
      <div id="fp-error" style="display:none;background:#dce4f8;border:1px solid #adc1ef;color:#214aac;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;"></div>
      <form id="fp-step1">
        <div class="field id-field"><label>Email address</label><input class="input" name="email" type="email" required autocomplete="username" placeholder="Enter your registered email"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-paper-plane"></i> Send OTP</button>
      </form>
      <form id="fp-step2" style="display:none;">
        <div class="field"><label>Enter OTP</label><input class="input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code from your email" required style="letter-spacing:4px;text-align:center;font-size:18px;"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-check"></i> Verify OTP</button>
        <p class="text-dim" style="text-align:center;margin-top:12px;font-size:13px;">Didn't get it? <a href="#" id="fp-resend" class="text-accent">Resend OTP</a></p>
      </form>
      <form id="fp-step3" style="display:none;">
        <div class="field"><label>New password</label><input class="input" name="p1" type="password" minlength="6" required autocomplete="new-password"></div>
        <div class="field"><label>Confirm new password</label><input class="input" name="p2" type="password" minlength="6" required autocomplete="new-password"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-key"></i> Save new password</button>
      </form>
      <p class="text-dim" style="text-align:center;margin-top:14px;font-size:13.5px;"><a href="login.html" class="text-accent">&larr; Back to login</a></p>
    </div>

    <!-- Looping clip showing the whole flow: search -> cart -> pay ->
         confirmed (green) / awaiting (amber) / failed (red) -->
    <div id="walkthrough"></div>
  </section>
</main>

<div id="site-footer"></div>

<script>const ROOT_PREFIX = '../';</script>

<script>
document.addEventListener('DOMContentLoaded', function(){
App.boot('').then(() => {
  // Mobile-number login is OFF unless the admin switches it on (Admin -> Branding & Invoice).
  Auth.mobileLoginEnabled().then(on => {
    document.querySelectorAll('.id-field').forEach(f => {
      const lab = f.querySelector('label'), inp = f.querySelector('input');
      if (on){ if (lab) lab.textContent = 'Phone number or email'; inp.placeholder = '10-digit phone or email'; inp.type = 'text'; inp.inputMode = 'email'; }
    });
  });
  Walkthrough.mount(document.getElementById('walkthrough'));
  const err = document.getElementById('fp-error'), sub = document.getElementById('fp-sub');
  const s1 = document.getElementById('fp-step1'), s2 = document.getElementById('fp-step2'), s3 = document.getElementById('fp-step3');
  let email = '';
  const showErr = m => { err.textContent = m; err.style.display = 'block'; };
  const busy = (form, on, label) => { const b = form.querySelector('button[type=submit]'); if (on){ b.dataset.h = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-spinner spin"></i> ' + label; } else { b.disabled = false; b.innerHTML = b.dataset.h; } };

  async function send(form){
    err.style.display = 'none';
    if (form) busy(form, true, 'Sending…');
    const r = await Auth.sendResetOtp(email);
    if (form) busy(form, false);
    if (!r.ok){ showErr(r.error); return false; }
    if (r.email) email = r.email;
    Notify.toast('OTP sent to ' + email, 'success');
    return true;
  }
  s1.addEventListener('submit', async e => {
    e.preventDefault();
    email = new FormData(s1).get('email').trim();
    if (await send(s1)){
      s1.style.display = 'none'; s2.style.display = 'block';
      sub.textContent = 'We sent a one-time code to ' + email + '. Enter it below.';
    }
  });
  document.getElementById('fp-resend').addEventListener('click', async e => { e.preventDefault(); await send(null); });
  s2.addEventListener('submit', async e => {
    e.preventDefault(); err.style.display = 'none';
    busy(s2, true, 'Verifying…');
    const r = await Auth.verifyResetOtp(email, new FormData(s2).get('code'));
    busy(s2, false);
    if (!r.ok){ showErr(r.error); return; }
    s2.style.display = 'none'; s3.style.display = 'block';
    sub.textContent = 'OTP verified. Set your new password.';
  });
  s3.addEventListener('submit', async e => {
    e.preventDefault(); err.style.display = 'none';
    const fd = new FormData(s3);
    if (fd.get('p1') !== fd.get('p2')){ showErr('Passwords do not match.'); return; }
    busy(s3, true, 'Saving…');
    const r = await Auth.setNewPassword(fd.get('p1'));
    busy(s3, false);
    if (!r.ok){ showErr(r.error); return; }
    Notify.toast('Password changed. Please log in.', 'success');
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  });
});
});
</script>
