<main>
  <section class="container auth-split">
    <div class="card auth-card">
      <div style="text-align:center;margin-bottom:20px;">
        <div data-logo-slot style="width:56px;height:56px;margin:0 auto 12px;">
          <img class="logo-img" alt="SM Mobile Deals" style="display:none;width:100%;height:100%;object-fit:contain;">
          <div class="logo-fallback" style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--deal));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;"><i class="fa-solid fa-bolt"></i></div>
        </div>
        <h1 style="font-family:var(--font-display);font-size:22px;margin:0 0 4px;">Welcome back</h1>
        <p class="text-dim" style="font-size:13.5px;margin:0;">Log in to your SM Mobile Deals account</p>
      </div>
      <div id="login-tabs" style="display:flex;gap:8px;margin-bottom:16px;">
        <button type="button" class="btn btn-primary btn-sm" data-ltab="pw" style="flex:1;">Password</button>
        <button type="button" class="btn btn-outline btn-sm" data-ltab="otp" style="flex:1;">Login with OTP</button>
      </div>
      <form id="otp-start-form" style="display:none;">
        <div id="otp-start-error" style="display:none;background:#dce4f8;border:1px solid #adc1ef;color:#214aac;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;"></div>
        <div class="field id-field"><label>Email address</label><input class="input" name="email" type="email" required autocomplete="username" placeholder="Enter your registered email"><span class="text-faint" style="font-size:11.5px;">A one-time code (OTP) is sent to your registered email.</span></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-paper-plane"></i> Send OTP</button>
      </form>
      <form id="otp-form" style="display:none;">
        <div id="otp-error" style="display:none;background:#dce4f8;border:1px solid #adc1ef;color:#214aac;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;"></div>
        <p class="text-dim" style="font-size:13.5px;margin:0 0 14px;text-align:center;">We sent a one-time code to <b id="otp-email"></b>. Enter it below.</p>
        <div class="field"><label>Enter OTP</label><input class="input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required placeholder="Code from your email" style="letter-spacing:4px;text-align:center;font-size:18px;"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="otp-submit-btn"><i class="fa-solid fa-check"></i> Verify &amp; Login</button>
        <p class="text-dim" style="text-align:center;margin-top:12px;font-size:13px;">Didn't get it? <a href="#" id="otp-resend" class="text-accent">Resend OTP</a></p>
      </form>
      <form id="login-form">
        <div id="login-error" style="display:none;background:#dce4f8;border:1px solid #adc1ef;color:#214aac;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;"></div>
        <div class="field id-field"><label>Email address</label><input class="input" name="email" type="email" required autocomplete="username" placeholder="Enter your registered email"></div>
        <div class="field"><label>Password</label><input class="input" name="password" type="password" required></div>
        <div style="text-align:right;margin:-4px 0 14px;"><a href="forgot-password.html" class="text-accent" style="font-size:13px;">Forgot password?</a></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" disabled id="login-submit-btn"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      </form>
      <p class="text-dim" style="text-align:center;margin-top:14px;font-size:13.5px;">New here? <a href="register.html" class="text-accent">Create an account</a></p>
    </div>

    <!-- Looping clip showing the whole flow: search -> cart -> pay ->
         confirmed (green) / awaiting (amber) / failed (red) -->
    <div id="walkthrough"></div>
  </section>

<script>const ROOT_PREFIX = '../';</script>

<script>
document.addEventListener('DOMContentLoaded', function(){
App.boot('').then(() => {
  Walkthrough.mount(document.getElementById('walkthrough'));
  document.getElementById('login-submit-btn').disabled = false;
  // Mobile-number login is OFF unless the admin switches it on (Admin -> Branding & Invoice).
  Auth.mobileLoginEnabled().then(on => {
    document.querySelectorAll('.id-field').forEach(f => {
      const lab = f.querySelector('label'), inp = f.querySelector('input');
      if (on){ if (lab) lab.textContent = 'Phone number or email'; inp.placeholder = '10-digit phone or email'; inp.type = 'text'; inp.inputMode = 'email'; }
    });
  });
  let otpState = null;
  const loginForm = document.getElementById('login-form'), startForm = document.getElementById('otp-start-form');
  const tabs = document.getElementById('login-tabs');
  function showTab(t){
    document.getElementById('otp-form').style.display = 'none';
    loginForm.style.display = t === 'pw' ? 'block' : 'none';
    startForm.style.display = t === 'otp' ? 'block' : 'none';
    tabs.querySelectorAll('[data-ltab]').forEach(b => { const on = b.dataset.ltab === t; b.classList.toggle('btn-primary', on); b.classList.toggle('btn-outline', !on); });
  }
  tabs.addEventListener('click', e => { const b = e.target.closest('[data-ltab]'); if (b) showTab(b.dataset.ltab); });
  startForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('otp-start-error'); box.style.display = 'none';
    const btn = e.target.querySelector('button[type=submit]'); const h = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Sending…';
    const r = await Auth.startOtpLogin(new FormData(startForm).get('email'));
    btn.disabled = false; btn.innerHTML = h;
    if (!r.ok){ box.textContent = r.error; box.style.display = 'block'; return; }
    otpState = { email:r.email, type:r.otpType };
    document.getElementById('otp-email').textContent = r.email;
    startForm.style.display = 'none'; document.getElementById('otp-form').style.display = 'block';
    Notify.toast('OTP sent to ' + r.email, 'success');
  });
  const otpForm = document.getElementById('otp-form'), otpErr = document.getElementById('otp-error');
  otpForm.addEventListener('submit', async (e) => {
    e.preventDefault(); otpErr.style.display = 'none';
    const b = document.getElementById('otp-submit-btn'); const h = b.innerHTML;
    b.disabled = true; b.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Verifying…';
    const r = await Auth.verifyLoginOtp(otpState.email, new FormData(otpForm).get('code'), otpState.type);
    b.disabled = false; b.innerHTML = h;
    if (!r.ok){ otpErr.textContent = r.error; otpErr.style.display = 'block'; return; }
    if (r.user && (r.user.role === 'admin' || r.user.role === 'staff')){        // customer app: admin/staff must use the Admin login
      try{ await Auth.logout(); }catch(e){}
      otpErr.textContent = 'Admin / Staff accounts cannot log in here. Please use the Admin login.'; otpErr.style.display = 'block'; return;
    }
    Notify.toast(`Welcome, ${r.user.name}!`, 'success');
    setTimeout(() => { window.location.href = 'profile.html'; }, 600);
  });
  document.getElementById('otp-resend').addEventListener('click', async (e) => {
    e.preventDefault();
    const r = await Auth.resendOtp(otpState.email, otpState.type);
    Notify.toast(r.ok ? 'OTP sent again' : r.error, r.ok ? 'success' : 'error');
  });
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('login-error');
    errorBox.style.display = 'none';
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> Logging in…';
    const fd = new FormData(e.target);
    const result = await Auth.login({ email: fd.get('email'), password: fd.get('password') });
    if (!result.ok){
      errorBox.textContent = result.error || 'Incorrect email or password. Please check and try again.';
      errorBox.style.display = 'block';
      Notify.toast(result.error, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
      return;
    }
    if (result.needsOtp){
      otpState = { email: result.email, type: result.otpType };
      document.getElementById('otp-email').textContent = result.email;
      e.target.style.display = 'none';
      document.getElementById('otp-form').style.display = 'block';
      Notify.toast('OTP sent to ' + result.email, 'success');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
      return;
    }
    if (result.user && (result.user.role === 'admin' || result.user.role === 'staff')){   // customer app: admin/staff must use the Admin login
      try{ await Auth.logout(); }catch(e){}
      errorBox.textContent = 'Admin / Staff accounts cannot log in here. Please use the Admin login.'; errorBox.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
      return;
    }
    Notify.toast(`Welcome, ${result.user.name}!`, 'success');
    setTimeout(() => { window.location.href = 'profile.html'; }, 600);
  });
});
});
</script>
