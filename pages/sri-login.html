<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('smd_theme') || 'dark');}catch(e){}setTimeout(function(){var e=document.getElementById('page-loader');if(e){e.classList.add('hide');setTimeout(function(){e.remove()},400)}},1800);})();</script>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/dark-mode.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% -10%,#3868d955,transparent),radial-gradient(900px 500px at 100% 110%,#5c84e055,transparent),var(--bg,#050812);color:var(--text,#e8ecf8);font-family:'Inter',system-ui,sans-serif;padding:16px}
  .gw{width:100%;max-width:420px;background:var(--surface,#141414);border:1px solid var(--border-soft,#444444);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  h1{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
  .sub{font-size:12.5px;opacity:.65;margin:0 0 18px}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .role{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;border:1.5px solid var(--border-soft,#444444);background:transparent;color:inherit;cursor:pointer;font-weight:600;font-size:13px}
  .role[aria-pressed=true]{border-color:#7a9ae6;background:#3868d91f}
  .f{margin-bottom:12px}
  .f label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:6px}
  .f input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border-soft,#444444);background:var(--surface-2,#0d0d0d);color:inherit;font-size:15px}
  .f input:focus{outline:2px solid #7a9ae6;outline-offset:1px}
  button.go{width:100%;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#4d78dd,#2555c4)}
  button.go:disabled{opacity:.6;cursor:wait}
  .err{min-height:18px;color:#84a2e8;font-size:12.5px;margin:6px 0 10px}
  .hint{font-size:11.5px;opacity:.55;margin-top:14px;text-align:center}
  .hide{display:none}
  svg{flex:none}
</style>
    <link rel="stylesheet" href="../css/color-fix.css"><link rel="stylesheet" href="../css/final-fix.css">
<link rel="stylesheet" href="../css/ultrawide.css">
</head>
<body>
<main class="gw">
  <h1><svg width="28" height="28" viewBox="0 0 24 24"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a9ae6"/><stop offset="1" stop-color="#5c84e0"/></linearGradient></defs><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" fill="url(#g1)"/><path d="m8.5 12 2.4 2.4L15.8 9.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Master Gateway</h1>
  <p class="sub">Authorised personnel only.</p>

  <div class="roles" id="roles">
    <button type="button" class="role" data-role="admin" aria-pressed="true">
      <svg width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="#f59e0b"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#5c84e0"/><path d="m12 13 1.6 2.4L12 18l-1.6-2.6z" fill="#fde68a"/></svg>Admin 1</button>
    <button type="button" class="role" data-role="staff" aria-pressed="false">
      <svg width="30" height="30" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="#22c55e"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#5c84e0"/><rect x="9.5" y="14" width="5" height="3" rx="1" fill="#bbf7d0"/></svg>Staff</button>
  </div>

  <form id="f-cred" autocomplete="off">
    <div class="f"><label for="u"><svg id="ic-u" width="18" height="18" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3" fill="#5c84e0"/><path d="m3 7 9 7 9-7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span id="lbl-u">Email</span></label><input id="u" required autocapitalize="off" spellcheck="false"></div>
    <div class="f"><label for="p"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3" fill="#f59e0b"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="#6f92e3" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="12" cy="15.5" r="1.7" fill="#fff"/></svg>Password</label><input id="p" type="password" required autocomplete="off"></div>
    <div class="err" id="e1" role="alert"></div>
    <button class="go" id="b1">Continue</button>
  </form>

  <form id="f-otp" class="hide" autocomplete="off">
    <div class="f"><label for="o"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="#ec4899"/><circle cx="8" cy="12" r="1.6" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fde047"/><circle cx="16" cy="12" r="1.6" fill="#fff"/></svg>6-digit OTP sent to the admin mailbox</label><input id="o" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></div>
    <div class="err" id="e2" role="alert"></div>
    <button class="go" id="b2">Verify &amp; enter</button>
  </form>
  <p class="hint">🛰️ Sign-in attempts are logged. Your location is requested only if you allow it.</p>
</main>

<script>const ROOT_PREFIX='../';</script>
<script defer src="../js/vendor/supabase.min.js"></script>
<script defer src="../js/supabase-client.js"></script>
<script defer src="../js/config.js"></script>
<script defer src="../js/utils.js"></script>
<script defer src="../js/data.js"></script>
<script defer src="../js/specs.js"></script><script defer src="../js/charging.js"></script><script defer src="../js/auto-specs.js"></script>
<script defer src="../js/auth.js"></script>
<script defer src="../js/geo.js"></script>
<script defer src="../js/master-gateway.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function(){
  const $ = id => document.getElementById(id);
  let role = 'admin', challenge = null, pwd = '', mail = '', geoCache = null;
  try{ await DB.init(); await Auth.init(); }catch(e){}

  document.querySelectorAll('.role').forEach(b => b.onclick = () => {
    role = b.dataset.role;
    document.querySelectorAll('.role').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('lbl-u').textContent = role === 'admin' ? 'Email' : 'Username';
    $('u').type = role === 'admin' ? 'email' : 'text';
    $('e1').textContent = '';
  });
  $('u').type = 'email';

  async function geo(){
    if (geoCache) return geoCache;
    const r = await Geo.requestWithNotice('Admin / staff sign-in is protected by a location check.');
    geoCache = r.ok ? { lat:r.lat, lng:r.lng, accuracy:r.accuracy } : null;
    return geoCache;
  }
  async function enter(res, extra){
    const g = await Auth.masterGrant({ role: res.role, token: res.token, ...extra });
    if (!g.ok){ $('e2').textContent = g.error || 'Could not start session.'; $('e1').textContent = g.error || ''; return; }
    location.replace('/pages/admin.html');
  }

  $('f-cred').onsubmit = async (e) => {
    e.preventDefault(); $('e1').textContent = ''; $('b1').disabled = true;
    const g = await geo();
    const u = $('u').value.trim(), p = $('p').value;
    if (role === 'admin'){
      const r = await MasterGateway.startAdmin(u, p, g);
      $('b1').disabled = false;
      if (!r.ok) return $('e1').textContent = r.error || 'Invalid credentials';
      challenge = r.challenge; pwd = p; mail = u;
      $('f-cred').classList.add('hide'); $('f-otp').classList.remove('hide'); $('o').focus();
    } else {
      const r = await MasterGateway.staff(u, p, g);
      $('b1').disabled = false;
      if (!r.ok) return $('e1').textContent = r.error || 'Invalid credentials';
      await enter(r, {});
    }
  };
  $('f-otp').onsubmit = async (e) => {
    e.preventDefault(); $('e2').textContent = ''; $('b2').disabled = true;
    const r = await MasterGateway.verifyAdmin(challenge, $('o').value.trim(), await geo());
    $('b2').disabled = false;
    if (!r.ok) return $('e2').textContent = r.error || 'Wrong OTP';
    await enter(r, { email: mail, password: pwd });
  };
});
</script>
<script src="../js/fast-nav.js"></script>
</body>
</html>
